<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ฮีโร่พิทักษ์ห้องคอมฯ (Computer Room Hero)</title>
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้า Google Fonts: Kanit เพื่อให้อ่านง่ายสำหรับเด็ก -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- นำเข้า Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #eff6ff; /* blue-50 */
            background-image: radial-gradient(#bfdbfe 2px, transparent 2px);
            background-size: 30px 30px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .hidden { display: none !important; }
        
        /* ปุ่มเด้งดึ๋ง */
        .btn-press {
            transition: all 0.2s;
        }
        .btn-press:hover {
            transform: translateY(4px) scale(1.05);
        }
        .btn-press:active {
            transform: translateY(8px) scale(0.95);
            box-shadow: none !important;
        }
    </style>
</head>
<body class="selection:bg-blue-200">

    <!-- ================= START SCREEN ================= -->
    <div id="start-screen" class="flex flex-col items-center text-center animate-fade-in w-full max-w-3xl">
        <div class="bg-white p-8 rounded-full shadow-xl mb-6 border-8 border-blue-200">
            <i data-lucide="shield-check" class="text-blue-500 w-24 h-24 drop-shadow-md"></i>
        </div>
        <h1 class="text-4xl md:text-5xl font-extrabold text-blue-800 mb-4 drop-shadow-sm">
            ฮีโร่พิทักษ์ห้องคอมฯ
        </h1>
        <p class="text-xl md:text-2xl text-blue-700 mb-10 font-medium">
            มาเรียนรู้วิธีการใช้คอมพิวเตอร์อย่างปลอดภัยกันเถอะ!
        </p>
        <button onclick="startGame()" class="btn-press group relative inline-flex items-center justify-center px-10 py-5 text-2xl font-bold text-white bg-green-500 rounded-full shadow-[0_8px_0_rgb(21,128,61)] hover:bg-green-600 hover:shadow-[0_4px_0_rgb(21,128,61)]">
            <i data-lucide="play" class="mr-3 w-8 h-8 group-hover:animate-pulse"></i>
            เริ่มเกมเลย!
        </button>
    </div>

    <!-- ================= GAME SCREEN ================= -->
    <div id="game-screen" class="hidden flex flex-col items-center w-full max-w-3xl">
        <!-- Header / Progress -->
        <div class="flex justify-between items-center w-full mb-6 bg-white p-4 rounded-2xl shadow-sm border-2 border-blue-100">
            <div class="text-xl font-bold text-blue-800 flex items-center">
                <i data-lucide="monitor-play" class="mr-2 text-blue-500"></i>
                ข้อที่ <span id="q-number" class="ml-2">1</span> / 8
            </div>
            <div class="text-xl font-bold text-orange-500 flex items-center">
                <i data-lucide="star" class="mr-1 fill-current"></i>
                คะแนน: <span id="score-display" class="ml-2">0</span>
            </div>
        </div>

        <!-- Question Card -->
        <div class="bg-white w-full p-8 md:p-12 rounded-3xl shadow-lg border-b-8 border-blue-200 text-center mb-8 transform transition-all hover:scale-[1.02]">
            <div id="q-emoji" class="text-7xl md:text-8xl mb-6">🥤🍩</div>
            <h2 id="q-text" class="text-3xl md:text-4xl font-bold text-gray-800 leading-snug">
                นำน้ำและขนมมากินที่หน้าโต๊ะคอมพิวเตอร์
            </h2>
        </div>

        <!-- Choice Buttons -->
        <div class="flex flex-col md:flex-row gap-6 w-full">
            <button onclick="handleAnswer(true)" class="btn-press flex-1 flex flex-col items-center justify-center p-6 bg-green-100 border-4 border-green-500 rounded-3xl hover:bg-green-200 shadow-[0_6px_0_rgb(34,197,94)] hover:shadow-[0_3px_0_rgb(34,197,94)] group">
                <div class="bg-green-500 text-white p-4 rounded-full mb-3 shadow-md group-hover:animate-bounce">
                    <i data-lucide="thumbs-up" class="w-12 h-12"></i>
                </div>
                <span class="text-2xl font-extrabold text-green-700">พฤติกรรมที่ดี</span>
                <span class="text-lg font-bold text-green-600 mt-1">(ควรทำ)</span>
            </button>

            <button onclick="handleAnswer(false)" class="btn-press flex-1 flex flex-col items-center justify-center p-6 bg-red-100 border-4 border-red-500 rounded-3xl hover:bg-red-200 shadow-[0_6px_0_rgb(239,68,68)] hover:shadow-[0_3px_0_rgb(239,68,68)] group">
                <div class="bg-red-500 text-white p-4 rounded-full mb-3 shadow-md group-hover:animate-bounce">
                    <i data-lucide="thumbs-down" class="w-12 h-12"></i>
                </div>
                <span class="text-2xl font-extrabold text-red-700">พฤติกรรมที่ไม่ดี</span>
                <span class="text-lg font-bold text-red-600 mt-1">(ไม่ควรทำ)</span>
            </button>
        </div>
    </div>

    <!-- ================= FEEDBACK MODAL ================= -->
    <div id="feedback-modal" class="hidden fixed inset-0 bg-blue-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-xl w-full text-center shadow-2xl border-8 border-white relative overflow-hidden transform scale-100 transition-transform">
            
            <!-- Decorative background circle -->
            <div id="feedback-bg-circle" class="absolute -top-20 -right-20 w-48 h-48 rounded-full opacity-20"></div>

            <div class="flex justify-center mb-6 relative z-10">
                <div id="feedback-icon-container" class="p-4 rounded-full">
                    <!-- Icon will be injected here -->
                </div>
            </div>
            
            <h2 id="feedback-title" class="text-4xl font-extrabold mb-4 relative z-10">
                <!-- Title -->
            </h2>
            
            <div class="bg-blue-50 p-6 rounded-2xl border-2 border-blue-100 mb-8 relative z-10">
                <p id="feedback-explanation" class="text-2xl font-medium text-blue-900">
                    <!-- Explanation -->
                </p>
            </div>
            
            <button onclick="nextQuestion()" class="btn-press w-full inline-flex items-center justify-center px-8 py-4 text-2xl font-bold text-white bg-blue-500 rounded-2xl hover:bg-blue-600 shadow-[0_6px_0_rgb(29,78,216)] hover:shadow-[0_3px_0_rgb(29,78,216)] relative z-10">
                <span id="btn-next-text">ข้อต่อไป</span>
                <i data-lucide="arrow-right" class="ml-2 w-6 h-6"></i>
            </button>
        </div>
    </div>

    <!-- ================= END SCREEN ================= -->
    <div id="end-screen" class="hidden flex flex-col items-center bg-white p-10 md:p-14 rounded-3xl shadow-xl w-full max-w-2xl text-center border-4 border-yellow-200">
        <h2 class="text-4xl md:text-5xl font-extrabold text-blue-800 mb-6">
            สรุปคะแนนฮีโร่!
        </h2>
        
        <div id="end-stars" class="flex justify-center gap-4 mb-8">
            <!-- Stars will be injected here -->
        </div>

        <div class="text-6xl font-black text-orange-500 mb-6 drop-shadow-sm">
            <span id="final-score">0</span> / 8
        </div>

        <p id="end-message" class="text-2xl md:text-3xl text-blue-700 font-bold mb-10">
            <!-- End message -->
        </p>

        <button onclick="startGame()" class="btn-press inline-flex items-center justify-center px-10 py-5 text-2xl font-bold text-white bg-orange-500 rounded-full hover:bg-orange-600 shadow-[0_8px_0_rgb(194,65,12)] hover:shadow-[0_4px_0_rgb(194,65,12)]">
            <i data-lucide="play" class="mr-3 w-8 h-8"></i>
            เล่นใหม่อีกครั้ง
        </button>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // ข้อมูลคำถามทั้งหมด (ตรงตามตัวชี้วัด ป.2/4)
        const QUESTIONS = [
            {
                text: "นำน้ำและขนมมากินที่หน้าโต๊ะคอมพิวเตอร์",
                emoji: "🥤🍩",
                isGood: false,
                explanation: "น้ำอาจหกใส่เครื่องคอมพิวเตอร์พังได้"
            },
            {
                text: "ปิดเครื่องคอมพิวเตอร์อย่างถูกขั้นตอนหลังจากใช้งานเสร็จ",
                emoji: "🖥️🔌",
                isGood: true,
                explanation: "ช่วยยืดอายุการใช้งานของคอมพิวเตอร์"
            },
            {
                text: "บอกรหัสผ่านให้คนแปลกหน้ารู้",
                emoji: "🤫🔑",
                isGood: false,
                explanation: "ข้อมูลส่วนตัวอาจถูกขโมยได้"
            },
            {
                text: "แบ่งปันให้เพื่อนใช้คอมพิวเตอร์ด้วยกัน",
                emoji: "🤝👨‍💻",
                isGood: true,
                explanation: "เราต้องรู้จักแบ่งปันและทำตามข้อตกลงในการใช้ร่วมกัน"
            },
            {
                text: "ดึงสายไฟคอมพิวเตอร์เล่นอย่างรุนแรง",
                emoji: "⚡🔌",
                isGood: false,
                explanation: "สายไฟอาจขาดและทำให้ไฟดูดได้ อันตรายมาก!"
            },
            {
                text: "นั่งตัวตรง ห่างจากจอในระยะที่พอดี",
                emoji: "🪑👀",
                isGood: true,
                explanation: "ช่วยถนอมสายตาและไม่ปวดหลัง"
            },
            {
                text: "เล่นเกมคอมพิวเตอร์ทั้งวันโดยไม่พัก",
                emoji: "🎮😵",
                isGood: false,
                explanation: "จะทำให้ปวดตาและเสียสุขภาพ"
            },
            {
                text: "ขออนุญาตคุณครูก่อนเปิดใช้งานคอมพิวเตอร์",
                emoji: "🙋‍♂️👩‍🏫",
                isGood: true,
                explanation: "เป็นการปฏิบัติตามกฎของห้องเรียน"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        // Initialize Icons
        lucide.createIcons();

        function showScreen(screenId) {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('feedback-modal').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            
            document.getElementById(screenId).classList.remove('hidden');
        }

        function startGame() {
            score = 0;
            currentQuestionIndex = 0;
            updateScoreDisplay();
            loadQuestion();
            showScreen('game-screen');
        }

        function loadQuestion() {
            const q = QUESTIONS[currentQuestionIndex];
            document.getElementById('q-number').innerText = currentQuestionIndex + 1;
            document.getElementById('q-emoji').innerText = q.emoji;
            document.getElementById('q-text').innerText = q.text;
        }

        function updateScoreDisplay() {
            document.getElementById('score-display').innerText = score;
        }

        function handleAnswer(userChoiceIsGood) {
            const q = QUESTIONS[currentQuestionIndex];
            const isCorrect = (userChoiceIsGood === q.isGood);
            
            if (isCorrect) {
                score++;
                updateScoreDisplay();
            }

            // ตั้งค่าหน้า Feedback
            const bgCircle = document.getElementById('feedback-bg-circle');
            const iconContainer = document.getElementById('feedback-icon-container');
            const title = document.getElementById('feedback-title');
            
            if (isCorrect) {
                bgCircle.className = "absolute -top-20 -right-20 w-48 h-48 rounded-full opacity-20 bg-green-500";
                iconContainer.className = "bg-green-100 p-4 rounded-full animate-bounce";
                iconContainer.innerHTML = '<i data-lucide="check-circle-2" class="w-20 h-20 text-green-500"></i>';
                title.className = "text-4xl font-extrabold mb-4 relative z-10 text-green-600";
                title.innerText = "เก่งมาก! ตอบถูกครับ/ค่ะ 🎉";
            } else {
                bgCircle.className = "absolute -top-20 -right-20 w-48 h-48 rounded-full opacity-20 bg-red-500";
                iconContainer.className = "bg-red-100 p-4 rounded-full animate-pulse";
                iconContainer.innerHTML = '<i data-lucide="x-circle" class="w-20 h-20 text-red-500"></i>';
                title.className = "text-4xl font-extrabold mb-4 relative z-10 text-red-600";
                title.innerText = "อ๊ะอ๋า! ยังไม่ถูกนะ 🤔";
            }

            document.getElementById('feedback-explanation').innerText = q.explanation;
            
            const btnText = (currentQuestionIndex < QUESTIONS.length - 1) ? "ข้อต่อไป" : "ดูคะแนนรวม";
            document.getElementById('btn-next-text').innerText = btnText;

            // Render new icons inside feedback
            lucide.createIcons();
            
            // เปิดโหมด Feedback (แสดงซ้อนทับ Game Screen)
            document.getElementById('feedback-modal').classList.remove('hidden');
        }

        function nextQuestion() {
            document.getElementById('feedback-modal').classList.add('hidden');
            
            if (currentQuestionIndex < QUESTIONS.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            document.getElementById('final-score').innerText = score;
            
            // คำนวณดาว
            let starsCount = 0;
            if (score === QUESTIONS.length) starsCount = 3;
            else if (score >= 5) starsCount = 2;
            else if (score >= 1) starsCount = 1;

            // สร้าง UI ดาว
            let starsHtml = '';
            for(let i = 1; i <= 3; i++) {
                if (i <= starsCount) {
                    starsHtml += `<i data-lucide="star" class="w-20 h-20 text-yellow-400 fill-current scale-110 drop-shadow-md"></i>`;
                } else {
                    starsHtml += `<i data-lucide="star" class="w-20 h-20 text-gray-300"></i>`;
                }
            }
            document.getElementById('end-stars').innerHTML = starsHtml;

            // ข้อความสรุป
            let message = "";
            if (score === QUESTIONS.length) message = "ยอดเยี่ยม! หนูคือสุดยอดฮีโร่พิทักษ์ห้องคอมฯ 🥇";
            else if (score >= 5) message = "เก่งมาก! หนูเข้าใจกฎการใช้คอมพิวเตอร์ได้ดี 🥈";
            else message = "พยายามได้ดีมาก! มาลองเล่นอีกครั้งเพื่อเป็นฮีโร่กันเถอะ 🥉";
            
            document.getElementById('end-message').innerText = message;

            showScreen('end-screen');
            lucide.createIcons();
        }
    </script>
</body>
</html>
